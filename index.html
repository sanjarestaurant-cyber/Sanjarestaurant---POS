<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanja Rotti Shop · POS</title>
<meta name="theme-color" content="#1F2421">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --char:#1F2421; --turmeric:#F2A900; --chili:#D2352B; --leaf:#2F7D4F;
  --bg:#EFF1EC; --card:#FFFFFF; --ink:#1F2421; --muted:#6B726C; --line:#D9DDD6; --soft:#F6F7F4;
  --font:"Figtree","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141715;--card:#1E2320;--ink:#ECEFEA;--muted:#9EA69F;--line:#323933;--soft:#252B27}
}
:root[data-theme="dark"]{--bg:#141715;--card:#1E2320;--ink:#ECEFEA;--muted:#9EA69F;--line:#323933;--soft:#252B27}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--char);color:#fff}
.lbox{width:100%;max-width:360px}
.logo{width:60px;height:60px;border-radius:50%;background:var(--turmeric);color:var(--char);display:grid;place-items:center;font-weight:800;font-size:26px}
.lbox h1{font-size:34px;line-height:1.05;margin:18px 0 6px;font-weight:800}
.lbox p{margin:0 0 24px;opacity:.7}
.lbox label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;opacity:.85}
.lbox input{width:100%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);border-radius:10px;padding:13px;font-size:17px;margin-bottom:14px;color:#fff}
.err{background:rgba(210,53,43,.4);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.hint{margin-top:18px;font-size:13px;opacity:.65}

/* shell */
.top{background:var(--char);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:30;
  padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top .logo{width:36px;height:36px;font-size:17px}
.top .t{font-weight:800;font-size:18px;line-height:1.1}
.top .t small{display:block;font-weight:500;font-size:12px;opacity:.65}
.navs{display:flex;gap:4px;margin-left:auto;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}
.navs button{border:0;background:none;color:#fff;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px}
.navs button[aria-current="page"]{background:var(--turmeric);color:var(--char)}
.out{border:0;background:var(--chili);color:#fff;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700}
.out:hover{background:#B82C23}
@media (max-width:560px){.top{gap:8px;flex-wrap:wrap}.navs{order:3;width:100%;margin-left:0;overflow-x:auto}.navs button{flex:1}.out{margin-left:auto}.top .t{font-size:15px}.top .t small,.top>.logo,.lg{display:none}.navs button{padding:7px 10px;font-size:13px;white-space:nowrap}.out{padding:7px 8px;font-size:12px;white-space:nowrap}}
.demo{background:var(--turmeric);color:var(--char);text-align:center;font-size:13px;font-weight:700;padding:5px}

/* POS layout */
.pos{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 58px)}
@media (min-width:880px){.pos{grid-template-columns:1fr 380px}}
.menu{padding:14px 14px 150px}
@media (min-width:880px){.menu{padding:16px 18px 24px}}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--char);color:#fff}
.in{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;font-size:16px}
.in:focus{outline:none;border-color:var(--turmeric);box-shadow:0 0 0 3px rgba(242,169,0,.25)}
.table-in{width:92px}
.search{flex:1;min-width:150px}
.cats{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-weight:700;font-size:15px}
.cats button[aria-pressed="true"]{background:var(--turmeric);border-color:var(--turmeric);color:var(--char)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.98)}
.tile .n{font-weight:700;font-size:15px;line-height:1.2}
.tile .p{font-weight:800;font-size:16px;margin-top:8px}
.tile .s{font-size:12px;color:var(--muted);font-weight:600}
.tile .s.low{color:var(--chili)}
.tile .q{position:absolute;top:-7px;right:-7px;min-width:28px;height:28px;border-radius:14px;background:var(--chili);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 7px}
.tile[disabled]{opacity:.45;cursor:not-allowed}
.stripe-RC{border-top:4px solid var(--chili)} .stripe-R{border-top:4px solid var(--turmeric)} .stripe-B{border-top:4px solid #2E7FB8}
.empty{padding:30px 14px;text-align:center;color:var(--muted)}

/* cart */
.cart{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
@media (max-width:879px){
  .cart{position:fixed;left:0;right:0;bottom:0;z-index:40;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:88vh;transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.collapsed{transform:translateY(calc(100% - 78px - env(safe-area-inset-bottom,0px)))}
}
@media (min-width:880px){.cart{position:sticky;top:58px;height:calc(100vh - 58px)}.cart-peek{display:none!important}}
@media (prefers-reduced-motion:reduce){.cart{transition:none}}
.cart-peek{display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;background:var(--char);color:#fff;border-radius:18px 18px 0 0;width:100%;text-align:left}
.cart-peek b{font-size:20px;margin-left:auto}
.cart-head{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.cart-head h2{margin:0;font-size:19px}
.linkbtn{border:0;background:none;color:var(--chili);font-weight:700;font-size:14px}
.lines{flex:1;overflow:auto;padding:0 16px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .nm{font-weight:600}
.line .lt{font-weight:800;text-align:right}
.line .sub{font-size:13px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;justify-self:end}
.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--soft);font-weight:800;font-size:18px;line-height:1}
.qty span{min-width:22px;text-align:center;font-weight:800}
.pay{padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--soft)}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:15px}
.row.total{font-size:22px;font-weight:800;padding-top:6px}
.row .in{width:120px;text-align:right;padding:6px 9px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
.methods button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px}
.methods button[aria-pressed="true"]{background:var(--char);color:#fff;border-color:var(--char)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.change{font-weight:800;color:var(--leaf)}
.change.short{color:var(--chili)}
.save{width:100%;border:0;border-radius:12px;background:var(--chili);color:#fff;font-weight:800;font-size:17px;padding:14px;margin-top:10px}
.save:disabled{opacity:.5;cursor:not-allowed}

/* bills list */
.page{padding:16px 14px 40px;max-width:760px;margin:0 auto}
.page h2{font-size:26px;margin:4px 0 2px}
.muted{color:var(--muted);margin:0 0 14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kp small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.kp b{font-size:20px}
.blist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.blist li+li{border-top:1px solid var(--line)}
.blist button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;cursor:pointer}
.blist .g{flex:1}
.blist .m{font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--soft)}
.tag.void{background:#FDE3E1;color:var(--chili)}

/* modal + receipt */
.scrim{position:fixed;inset:0;background:rgba(15,17,16,.55);z-index:60}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);max-height:90vh;overflow:auto;background:var(--card);border-radius:16px;padding:16px}
.receipt{background:#fff;color:#111;border-radius:6px;padding:14px 12px;font-size:13px;border:1px dashed #bbb}
.receipt h3{text-align:center;margin:0;font-size:18px}
.receipt .c{text-align:center}
.receipt table{width:100%;border-collapse:collapse;margin:8px 0}
.receipt td{padding:2px 0;vertical-align:top}
.receipt td.r{text-align:right;white-space:nowrap}
.receipt hr{border:0;border-top:1px dashed #999;margin:6px 0}
.receipt .tot td{font-weight:800;font-size:16px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:0;border-radius:11px;padding:12px;font-weight:800;font-size:15px}
.btn.dark{background:var(--char);color:#fff}
.btn.yellow{background:var(--turmeric);color:var(--char)}
.btn.yellow:hover{background:#DB9900}
.btn.ghost{background:var(--soft);border:1px solid var(--line)}
.ok{text-align:center;color:var(--leaf);font-weight:800;font-size:22px;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--char);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;max-width:90vw;text-align:center}
.toast.bad{background:var(--chili)}
.toast button{margin-left:10px;border:0;background:var(--turmeric);color:var(--char);border-radius:6px;padding:4px 10px;font-weight:800}

/* item images */
.tile.has-img{padding:0;overflow:hidden}
.tile .ph{display:block;aspect-ratio:4/3;background:var(--soft) center/cover no-repeat;border-bottom:1px solid var(--line)}
.tile.has-img .body{display:flex;flex-direction:column;justify-content:space-between;padding:9px 11px 11px;flex:1}
.tile.has-img .q{top:6px;right:6px}
/* menu manager */
.mlist{list-style:none;margin:0 0 14px;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mlist li+li{border-top:1px solid var(--line)}
.mlist button{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;padding:10px 14px;cursor:pointer}
.thumb{width:54px;height:54px;border-radius:10px;background:var(--soft) center/cover no-repeat;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted);border:1px solid var(--line)}
.mlist .g{flex:1;min-width:0}.mlist .m{font-size:13px;color:var(--muted)}
.off{opacity:.5}
.form label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.form .in{width:100%}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgpick{display:flex;gap:12px;align-items:center;margin-top:4px}
.imgpick .big{width:110px;height:82px;border-radius:12px;background:var(--soft) center/cover no-repeat;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;flex:none}
.filebtn{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.filebtn input{display:none}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--chili)}
/* dashboard */
.dk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media (min-width:700px){.dk{grid-template-columns:repeat(3,1fr)}}
.dk div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.dk small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.dk b{font-size:22px}
.dk .pf b{color:var(--leaf)}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pays div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;border-top:4px solid var(--c)}
.pays small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.pays b{font-size:20px}
.pays span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:420px){.pays b{font-size:16px}} .dk .pf.neg b{color:var(--chili)}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.dcard h3{margin:0 0 10px;font-size:16px}
.hb{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.hb .t{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--turmeric);border-radius:5px}
.hb .v{text-align:right;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px dashed var(--line)}
.tbl .r{text-align:right}
.warn{background:#FFF1D6;color:#8A5A00;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.d2{display:grid;grid-template-columns:1fr;gap:0 12px}@media (min-width:760px){.d2{grid-template-columns:1fr 1fr}}
.scan{display:flex;gap:8px;margin-bottom:12px}
.scan .in{flex:1;font-size:17px;padding:11px 12px;border-width:2px}
.scan .in:focus{border-color:var(--turmeric)}
.cambtn{border:0;border-radius:10px;background:var(--char);color:#fff;padding:0 14px;font-weight:700;display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
.cambtn svg{width:20px;height:20px}
.tile .code{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.cam video{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover;display:block}
.cam .frame{position:relative}
.cam .frame::after{content:"";position:absolute;left:12%;right:12%;top:38%;height:24%;border:3px solid var(--turmeric);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.cam .st{margin:10px 0 0;font-size:14px;color:var(--muted);text-align:center}
.bcrow{display:flex;gap:8px}.bcrow .in{flex:1}
.profit{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--soft);font-size:14px;color:var(--muted)}
.profit.gain{background:#E3F2E8;color:var(--leaf)}
.profit.loss{background:#FDE3E1;color:var(--chili)}
#print{display:none}
@media print{
  @page{size:80mm auto;margin:3mm}
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print .receipt{border:0;padding:0;font-size:12px}
}
</style>
</head>
<body>

<section id="login" hidden>
  <form class="lbox" id="loginForm">
    <div class="logo">S</div>
    <h1>Sanja Rotti Shop</h1>
    <p>Log in to start billing.</p>
    <div class="err" id="lerr" hidden></div>
    <label for="lu">Username</label><input id="lu" autocomplete="username" autocapitalize="none" required>
    <label for="lp">PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button class="save" id="lbtn" type="submit">Log in</button>
    <div class="hint" id="lhint" hidden>Demo mode · try <b>owner / 1234</b> or <b>cashier / 1111</b></div>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="logo">S</div>
    <div class="t">Sanja Rotti Shop<small id="who"></small></div>
    <nav class="navs"><button data-view="pos">New bill</button><button data-view="bills">Today<span class="lg">’s bills</span></button><button data-view="menu" id="navMenu" hidden>Menu</button><button data-view="dash" id="navDash" hidden>Dashboard</button></nav>
    <button class="out" id="outBtn">Log out</button>
  </header>
  <div class="demo" id="demoBar" hidden>Demo mode · nothing is saved to Google Sheets</div>
  <div id="view"></div>
</div>

<div id="print"></div>

<script>
/* ===== SETTINGS ===== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbymoSXQxSSG9bLTfdQxguOJPEws81SP7u90CjZCPb-Z3ihRnHrYLaWu8k-kqIqB9B3N/exec',
  SHOP: 'Sanja Rotti Shop',
  ADDRESS: '',          // e.g. 'No 12, Main Street, Galle'
  PHONE: '',            // e.g. '077 123 4567'
  FOOTER: 'Thank you! Come again.'
};
// Demo mode when opened with ?demo or inside a preview that can't reach Google
const DEMO = /[?&]demo\b/.test(location.search) || !/^https?:$/.test(location.protocol) || /claude|anthropic/.test(location.hostname);

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const rs = n => 'Rs. ' + Math.round(n).toLocaleString('en-LK');
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2);
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
                del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const CAT_CODE = {'Rice & Curry':'RC', 'Rice':'R', 'Beverages':'B'};
const CAT_ORDER = ['Rice & Curry', 'Rice', 'Beverages'];
const PALETTE = ['#D2352B','#F2A900','#2E7FB8','#2F7D4F','#8A4FBF','#D9731A','#2A9D8F','#B83280'];
/** Categories that currently have items (known ones first, then the rest A–Z). */
function categoriesOf(list){
  const set = [...new Set(list.map(m => m.category).filter(Boolean))];
  return set.sort((a, b) => { const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); });
}
function catColor(c){ const i = CAT_ORDER.indexOf(c); if (i >= 0) return PALETTE[i];
  let h = 0; for (const ch of String(c)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[3 + h % (PALETTE.length - 3)]; }
function toast(msg, o = {}){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (o.bad ? ' bad' : ''); t.setAttribute('role','status');
  t.innerHTML = esc(msg) + (o.action ? ` <button>${esc(o.action)}</button>` : '');
  if (o.action) t.querySelector('button').onclick = () => { t.remove(); o.onAction(); };
  document.body.appendChild(t); if (!o.sticky) setTimeout(() => t.remove(), 3500);
}

/* ===== API ===== */
let S = store.get('sr-session');           // {token, user, shop}
async function api(action, data = {}){
  const body = {action, token: S && S.token, ...data};
  if (DEMO) return Demo(body);
  let res;
  try { res = await fetch(CONFIG.API_URL, {method:'POST', body: JSON.stringify(body)}); }
  catch(e){ throw new Error('Can’t reach the server. Check the internet connection.'); }
  const j = await res.json().catch(() => ({ok:false, error:'The server sent an unexpected reply. Check the Web app URL and deployment.'}));
  if (!j.ok){ if (j.code === 'AUTH') logout('Your session has ended. Log in again.'); throw new Error(j.error); }
  return j.data;
}

    <span><span class="p num">${rs(m.price)}</span>${m.trackStock ? `<br><span class="s ${left <= m.lowStock ? 'low' : ''}">${left <= 0 ? 'Out of stock' : left + ' left'}</span>` : ''}</span>`;
  return `<button class="tile${m.image ? ' has-img' : ''}" style="border-top:4px solid ${catColor(m.category)}" data-add="${m.itemId}" ${out ? 'disabled' : ''}>
    ${q ? `<span class="q num">${q}</span>` : ''}${m.image ? `<span class="ph" style="background-image:url('${esc(m.image)}')" role="img" aria-label="${esc(m.name)}"></span><span class="body">${info}</span>` : info}</button>`;
}

function changeQty(id, d){
  const m = MENU.find(x => x.itemId === id); if (!m) return;
  const q = Math.max(0, (CART.items[id] || 0) + d);
  if (d > 0 && m.trackStock && q > m.stock){ toast(`Only ${m.stock} ${m.name} left in stock.`, {bad:true}); return; }
  q ? CART.items[id] = q : delete CART.items[id]; saveCart(); refreshTilesAndCart();
}
/* ===== code / barcode entry ===== */
function findByCode(code){
  const c = String(code || '').trim(); if (!c) return null;
  return MENU.find(m => m.active !== false && ((m.barcode && m.barcode === c) || m.itemId.toUpperCase() === c.toUpperCase())) || null;
}
function addByCode(code){
  const c = String(code || '').trim(); if (!c) return false;
  const m = findByCode(c);
  if (!m){ beep(false); toast(`No item with code “${c}”.`, {bad:true}); return false; }
  const before = CART.items[m.itemId] || 0; changeQty(m.itemId, +1);
  if ((CART.items[m.itemId] || 0) > before){ beep(true); toast(`Added ${m.name} · ${CART.items[m.itemId]} on the bill`); return true; }
  beep(false); return false;
}
let AC;
function beep(ok){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = ok ? 1150 : 280; g.gain.value = .08; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (ok ? .09 : .25)); } catch(e){}
}
document.addEventListener('keydown', e => {
  if (VIEW === 'pos' && e.target.id === 'scan' && e.key === 'Enter'){ e.preventDefault(); addByCode(e.target.value); e.target.value = ''; }
});
// USB / Bluetooth scanners type very fast and press Enter. Catch that even when no box is focused.
let WEDGE = {buf:'', t:0};
document.addEventListener('keydown', e => {
  if (VIEW !== 'pos' || document.querySelector('.modal')) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const now = Date.now(); if (now - WEDGE.t > 80) WEDGE.buf = ''; WEDGE.t = now;
  if (e.key === 'Enter'){ if (WEDGE.buf.length >= 3){ e.preventDefault(); addByCode(WEDGE.buf); } WEDGE.buf = ''; return; }
  if (e.key.length === 1) WEDGE.buf += e.key;
});

/* ===== camera scanner ===== */
let CAM = null;
async function openCamera(onCode, single){
  closeCamera();
  const wrap = document.createElement('div'); wrap.className = 'scrim'; wrap.style.zIndex = 70;
  const box = document.createElement('div'); box.className = 'modal cam'; box.style.zIndex = 71; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
  box.innerHTML = `<h3 style="margin:0 0 10px">Scan barcode</h3><div class="frame"><video id="camV" playsinline muted></video></div>
    <p class="st" id="camSt">Starting camera…</p><button class="btn dark" style="width:100%;margin-top:10px" id="camDone">${single ? 'Cancel' : 'Done'}</button>`;
  document.body.append(wrap, box);
  CAM = {wrap, box, stop:null, last:'', lastT:0};
  wrap.onclick = closeCamera; box.querySelector('#camDone').onclick = closeCamera;
  const video = box.querySelector('#camV'), st = box.querySelector('#camSt');
  const hit = code => { const now = Date.now(); if (code === CAM.last && now - CAM.lastT < 1800) return; CAM.last = code; CAM.lastT = now;
    const ok = onCode(code); st.textContent = ok ? `✓ ${code}` : `Not found: ${code}`; if (single && ok) closeCamera(); };
  try {
    if ('BarcodeDetector' in window){
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      if (!CAM) { stream.getTracks().forEach(t => t.stop()); return; }
      video.srcObject = stream; await video.play();
      const formats = await BarcodeDetector.getSupportedFormats(); const det = new BarcodeDetector({formats});
      let on = true; CAM.stop = () => { on = false; stream.getTracks().forEach(t => t.stop()); };
      st.textContent = 'Point the camera at the barcode.';
      const loop = async () => { if (!on) return; try { const r = await det.detect(video); if (r[0]) hit(r[0].rawValue); } catch(e){} setTimeout(loop, 200); };
      loop();
    } else {
      if (!window.ZXingBrowser) await new Promise((ok, bad) => { const sc = document.createElement('script');
        sc.src = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js'; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
      if (!CAM) return;
      const reader = new ZXingBrowser.BrowserMultiFormatReader();
      st.textContent = 'Point the camera at the barcode.';
      const controls = await reader.decodeFromVideoDevice(undefined, video, res => { if (res) hit(res.getText()); });
      CAM.stop = () => controls.stop();
    }
  } catch(e){
    st.textContent = /Permission|NotAllowed/i.test(e && (e.name || e.message)) ? 'Camera access was blocked. Allow the camera for this site in your browser settings.' : 'The camera couldn’t start here. Use the code box or a USB scanner instead.';
  }
}
function closeCamera(){ if (!CAM) return; try { CAM.stop && CAM.stop(); } catch(e){} CAM.wrap.remove(); CAM.box.remove(); CAM = null; const s = $('#scan'); s && s.focus(); }

let saving = false;
async function saveBill(){
  if (saving) return; const t = totals();
  if (!t.count){ toast('Add at least one item.', {bad:true}); return; }
  if (CART.orderType === 'Dine-in' && !String(CART.tableNo).trim()){ toast('Enter the table number.', {bad:true}); $('#tableNo')?.focus(); return; }
  if (t.change < 0){ toast('Cash received is less than the total.', {bad:true}); return; }
  saving = true; const b = $('#saveBtn'); b.disabled = true; b.textContent = 'Saving…';
  try {
    const bill = await api('saveBill', {bill:{clientId:CART.clientId, orderType:CART.orderType, tableNo:CART.tableNo,
      items:t.lines.map(l => ({itemId:l.m.itemId, qty:l.qty})), discount:t.discount, paymentMethod:CART.paymentMethod, paid:t.paid}});
    CART = freshCart(); saveCart(); renderPOS(); openReceipt(bill, true); loadMenu();
  } catch(e){ toast(e.message, {bad:true, action:'Try again', onAction:saveBill, sticky:true}); }
  finally { saving = false; const b2 = $('#saveBtn'); if (b2){ b2.textContent = 'Save & print bill'; b2.disabled = !totals().count; } }
}

/* ===== receipt ===== */
function receiptHTML(b){
  return `<div class="receipt num"><h3>${esc(CONFIG.SHOP)}</h3>
    ${CONFIG.ADDRESS ? `<div class="c">${esc(CONFIG.ADDRESS)}</div>` : ''}${CONFIG.PHONE ? `<div class="c">Tel: ${esc(CONFIG.PHONE)}</div>` : ''}<hr>
    <div>Bill: <b>${esc(b.billNo)}</b></div><div>${esc(b.date)} ${esc(b.time)} · ${esc(b.orderType)}${b.tableNo ? ' · Table ' + esc(b.tableNo) : ''}</div><div>Cashier: ${esc(b.cashier)}</div>
    ${b.status === 'VOID' ? '<div class="c" style="font-weight:800;color:#D2352B">CANCELLED</div>' : ''}<hr>
    <table>${(b.items || []).map(i => `<tr><td>${esc(i.name)}<br><span style="color:#666">${i.qty} × ${Math.round(i.price).toLocaleString('en-LK')}</span></td><td class="r">${Math.round(i.lineTotal).toLocaleString('en-LK')}</td></tr>`).join('')}</table><hr>
    <table><tr><td>Subtotal</td><td class="r">${rs(b.subtotal)}</td></tr>${b.discount ? `<tr><td>Discount</td><td class="r">− ${rs(b.discount)}</td></tr>` : ''}
    <tr class="tot"><td>TOTAL</td><td class="r">${rs(b.total)}</td></tr><tr><td>${esc(b.paymentMethod)}</td><td class="r">${rs(b.paid)}</td></tr>
    ${b.change ? `<tr><td>Change</td><td class="r">${rs(b.change)}</td></tr>` : ''}</table><hr><div class="c">${esc(CONFIG.FOOTER)}</div></div>`;
}
function openReceipt(b, fresh){
  closeModal();
  const s = document.createElement('div'); s.className = 'scrim'; s.onclick = closeModal;
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML = `${fresh ? '<p class="ok">✓ Bill saved</p>' : ''}${receiptHTML(b)}
    <div class="mbtns"><button class="btn dark" id="prBtn">Print</button><button class="btn ghost" id="clBtn">${fresh ? 'New bill' : 'Close'}</button></div>`;
  document.body.append(s, m);
  m.querySelector('#prBtn').onclick = () => { $('#print').innerHTML = receiptHTML(b); try { window.print(); } catch(e){ toast('Printing isn’t available here.'); } };
  m.querySelector('#clBtn').onclick = closeModal; m.querySelector('#prBtn').focus();
}
function closeModal(){ document.querySelectorAll('.scrim,.modal').forEach(x => x.remove()); }
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (CAM) closeCamera(); else closeModal(); } });

/* ===== today's bills ===== */
async function renderBills(){
  $('#view').innerHTML = `<div class="page"><h2>Today’s bills</h2><p class="muted">Loading…</p></div>`;
  let bills = [];
  try { bills = await api('listBills'); } catch(e){ toast(e.message, {bad:true}); }
  if (VIEW !== 'bills') return;
  const ok = bills.filter(b => b.status !== 'VOID'), total = ok.reduce((a, b) => a + b.total, 0);
  $('#view').innerHTML = `<div class="page"><h2>Today’s bills</h2><p class="muted">${bills.length} bill${bills.length === 1 ? '' : 's'}</p>
    <div class="kp num"><div><small>Sales</small><b>${rs(total)}</b></div><div><small>Bills</small><b>${ok.length}</b></div><div><small>Average</small><b>${rs(ok.length ? total / ok.length : 0)}</b></div></div>
    ${bills.length ? `<ul class="blist">${bills.map(b => `<li><button data-bill="${esc(b.billNo)}"><div class="g"><b>${esc(b.billNo)}</b>
      <div class="m">${esc(b.time)} · ${esc(b.orderType)}${b.tableNo ? ' · Table ' + esc(b.tableNo) : ''} · ${esc(b.paymentMethod)}</div></div>
      ${b.status === 'VOID' ? '<span class="tag void">Cancelled</span>' : ''}<b class="num">${rs(b.total)}</b></button></li>`).join('')}</ul>`
      : '<div class="empty">No bills yet today. Start one from New bill.</div>'}
    <button class="btn ghost" style="margin-top:12px;width:100%" id="rf">Refresh</button></div>`;
}
document.addEventListener('click', async e => {
  if (VIEW !== 'bills') return;
  if (e.target.id === 'rf'){ renderBills(); return; }
  const b = e.target.closest('[data-bill]'); if (!b) return;
  try { openReceipt(await api('getBill', {billNo:b.dataset.bill})); } catch(err){ toast(err.message, {bad:true}); }
});

/* ===== menu manager (owner) ===== */
async function renderMenu(){
  $('#view').innerHTML = `<div class="page"><h2>Menu</h2><p class="muted">Loading…</p></div>`;
  try { MENU = await api('getMenu'); store.set('sr-menu', MENU); } catch(e){ toast(e.message, {bad:true}); }
  if (VIEW !== 'menu') return;
  const cats = categoriesOf(MENU);
  $('#view').innerHTML = `<div class="page"><h2>Menu</h2><p class="muted">${MENU.length} items in ${cats.length} categor${cats.length === 1 ? 'y' : 'ies'} · tap an item to change or remove it</p>
    <button class="save" style="margin:0 0 16px" data-edit="">+ Add item</button>
    ${cats.length ? '' : '<div class="empty">The menu is empty. Add your first item.</div>'}
    ${cats.map(c => { const list = MENU.filter(m => m.category === c); return `<h3 style="margin:6px 0 8px;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:3px;background:${catColor(c)}"></span>${esc(c)} <span class="muted" style="margin:0;font-size:14px;font-weight:600">(${list.length})</span></h3>` + (list.length ? `<ul class="mlist">${list.map(m => `<li class="${m.active ? '' : 'off'}"><button data-edit="${esc(m.itemId)}">
      <span class="thumb" style="${m.image ? `background-image:url('${esc(m.image)}')` : ''}">${m.image ? '' : esc(m.name[0] || '?')}</span>
      <span class="g"><b>${esc(m.name)}</b><br><span class="m">${esc(m.itemId)}${m.active ? '' : ' · hidden'}${m.trackStock ? ` · ${m.stock} in stock` : ''}${m.image ? '' : ' · no photo'}</span></span>
      <span class="num" style="text-align:right"><b>${rs(m.price)}</b>${m.hasCost === false ? '<br><span class="m" style="color:var(--chili);font-weight:700">Add cost price</span>' : ''}</span></button></li>`).join('')}</ul>` : '<p class="muted">No items yet.</p>'); }).join('')}</div>`;
}
let EDIT = null;
function editItem(id){
  const cats = categoriesOf(MENU);
  const m = MENU.find(x => x.itemId === id) || {itemId:'', name:'', category:cats[0] || '', price:'', active:true, trackStock:false, stock:0, lowStock:5, image:''};
  EDIT = {imageData:null, removeImage:false, image:m.image};
  closeModal();
  const s = document.createElement('div'); s.className = 'scrim'; s.onclick = closeModal;
  const d = document.createElement('div'); d.className = 'modal form'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML = `<h3 style="margin:0">${m.itemId ? 'Edit ' + esc(m.name) : 'Add item'}</h3>
    <label>Photo</label>
    <div class="imgpick"><div class="big" id="prev" style="${m.image ? `background-image:url('${esc(m.image)}')` : ''}">${m.image ? '' : 'No photo'}</div>
      <div><label class="filebtn" style="margin:0">Choose photo<input type="file" id="imgIn" accept="image/*"></label>
      ${m.image ? '<br><button type="button" class="linkbtn" id="rmImg" style="margin-top:8px">Remove photo</button>' : ''}</div></div>
    <label for="eName">Item name</label><input class="in" id="eName" value="${esc(m.name)}">
    <div class="two"><div><label for="eCat">Category</label><select class="in" id="eCat">${cats.map(c => `<option ${c === m.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__new" ${cats.length ? '' : 'selected'}>+ New category…</option></select>
      <input class="in" id="eNewCat" placeholder="New category name" maxlength="30" style="margin-top:6px" ${cats.length ? 'hidden' : ''}></div>
      <div></div></div>
    <div class="two"><div><label for="eCost">Cost price (Rs)</label><input class="in num" id="eCost" inputmode="decimal" value="${m.itemId && m.hasCost !== false ? esc(m.cost) : ''}" placeholder="To make or buy"></div>
      <div><label for="ePrice">Selling price (Rs)</label><input class="in num" id="ePrice" inputmode="numeric" value="${esc(m.price)}"></div></div>

    <label for="eBar">Barcode <span style="font-weight:500">(optional${m.itemId ? ' · item code ' + esc(m.itemId) + ' also works' : ''})</span></label>
    <div class="bcrow"><input class="in num" id="eBar" value="${esc(m.barcode || '')}" placeholder="Scan or type the barcode" autocomplete="off"><button type="button" class="cambtn" id="eBarCam" aria-label="Scan barcode with camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 8v8M11 8v8M14 8v8M17 8v8"/></svg></button></div>
    <label class="chk"><input type="checkbox" id="eActive" ${m.active ? 'checked' : ''}> Show on the bill screen</label>
    <label class="chk"><input type="checkbox" id="eTrack" ${m.trackStock ? 'checked' : ''}> Track stock for this item</label>
    <div class="two" id="stockBox" ${m.trackStock ? '' : 'hidden'}><div><label for="eLow">Warn when stock is at</label><input class="in num" id="eLow" inputmode="numeric" value="${esc(m.lowStock)}"></div>
      <div><label for="eAdd">Add stock now ${m.itemId ? `(now ${m.stock})` : ''}</label><input class="in num" id="eAdd" inputmode="numeric" placeholder="0"></div></div>
    <div class="mbtns"><button class="btn yellow" id="eSave">${m.itemId ? 'Save changes' : 'Add item'}</button><button class="btn ghost" id="eCancel">Cancel</button></div>
    ${m.itemId ? `<button class="btn ghost" id="eDel" style="width:100%;margin-top:8px;color:var(--chili)">Remove from menu</button>` : ''}`;
  document.body.append(s, d);
  d.dataset.id = m.itemId;
  $('#eTrack').onchange = e => $('#stockBox').hidden = !e.target.checked;
  $('#eCat').onchange = e => { const n = $('#eNewCat'); n.hidden = e.target.value !== '__new'; if (!n.hidden) n.focus(); };
  const del = $('#eDel'); if (del) del.onclick = () => deleteItem(m);
  $('#eBar').onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };
  $('#eBarCam').onclick = () => openCamera(code => { $('#eBar').value = code; beep(true); return true; }, true);
  $('#eCancel').onclick = closeModal;
  $('#imgIn').onchange = async e => { const f = e.target.files[0]; if (!f) return;
    try { EDIT.imageData = await shrink(f); EDIT.removeImage = false; const p = $('#prev'); p.style.backgroundImage = `url('${EDIT.imageData}')`; p.textContent = ''; }
    catch(err){ toast('That photo couldn’t be read. Try another one.', {bad:true}); } };
  const rm = $('#rmImg'); if (rm) rm.onclick = () => { EDIT.removeImage = true; EDIT.imageData = null; const p = $('#prev'); p.style.backgroundImage = ''; p.textContent = 'No photo'; };
  $('#eSave').onclick = saveItem;
  $('#eName').focus();
}
function shrink(file, max = 600){
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.8)); };
    img.onerror = bad; img.src = url;
  });
}
let savingItem = false;
async function saveItem(){
  if (savingItem) return; const b = $('#eSave'), id = document.querySelector('.modal').dataset.id;
  const cat = $('#eCat').value === '__new' ? $('#eNewCat').value.trim() : $('#eCat').value;
  if (!cat){ toast('Type a name for the new category.', {bad:true}); $('#eNewCat').focus(); return; }
  if ($('#eCost').value.trim() === ''){ toast('Enter the cost price (what it costs you to make or buy).', {bad:true}); $('#eCost').focus(); return; }
  if (N($('#eCost').value) > N($('#ePrice').value) && !confirm('The cost price is higher than the selling price. Save anyway?')) return;
  const item = {itemId:id || undefined, name:$('#eName').value, category:cat, price:$('#ePrice').value, cost:$('#eCost').value, barcode:$('#eBar').value.trim(),
    active:$('#eActive').checked, trackStock:$('#eTrack').checked, lowStock:$('#eLow').value,
    imageData:EDIT.imageData || undefined, removeImage:EDIT.removeImage || undefined};
  savingItem = true; b.disabled = true; b.textContent = EDIT.imageData ? 'Uploading photo…' : 'Saving…';
  try {
    let saved = await api('saveItem', {item});
    const add = N($('#eAdd').value);
    if (item.trackStock && add > 0) saved = await api('stockIn', {itemId:saved.itemId, qty:add, note:'Added from Menu screen'});
    closeModal(); toast(`Saved ${saved.name}`); renderMenu();
  } catch(e){ toast(e.message, {bad:true}); b.disabled = false; b.textContent = 'Save changes'; }
  finally { savingItem = false; }
}
async function deleteItem(m){
  const lastInCat = MENU.filter(x => x.category === m.category).length === 1;
  const msg = `Remove “${m.name}” from the menu?\n\nPast bills keep this item.` + (lastInCat ? `\n\nIt’s the last item in “${m.category}”, so that category will be removed too.` : '');
  if (!confirm(msg)) return;
  const b = $('#eDel'); b.disabled = true; b.textContent = 'Removing…';
  try {
    const r = await api('deleteItem', {itemId:m.itemId});
    if (CART.items[m.itemId]){ delete CART.items[m.itemId]; saveCart(); }
    MENU = MENU.filter(x => x.itemId !== m.itemId); store.set('sr-menu', MENU);
    closeModal(); toast(r.categoryRemoved ? `Removed ${r.name} and the “${r.category}” category` : `Removed ${r.name}`); renderMenu();
  } catch(e){ toast(e.message, {bad:true}); b.disabled = false; b.textContent = 'Remove from menu'; }
}
/* ===== dashboard (owner only) ===== */
const lkDate = (d = new Date()) => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Colombo'}).format(d);
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
let DP = 'today', DR = {from:'', to:''};
function dashRange(){
  const t = lkDate(), dow = (new Date(t + 'T12:00:00Z').getUTCDay() + 6) % 7;
  if (DP === 'today') return {from:t, to:t, label:'Today'};
  if (DP === 'yesterday'){ const y = addDays(t, -1); return {from:y, to:y, label:'Yesterday'}; }
  if (DP === 'week') return {from:addDays(t, -dow), to:t, label:'This week'};
  if (DP === 'month') return {from:t.slice(0,8) + '01', to:t, label:'This month'};
  return {from:DR.from || t, to:DR.to || DR.from || t, label:'Custom dates'};
}
async function renderDash(){
  const r = dashRange();
  const chips = [['today','Today'],['yesterday','Yesterday'],['week','This week'],['month','This month'],['custom','Pick dates']]
    .map(([k, l]) => `<button data-dp="${k}" aria-pressed="${DP === k}">${l}</button>`).join('');
  $('#view').innerHTML = `<div class="page"><h2>Dashboard</h2><p class="muted">${r.label} · ${r.from === r.to ? r.from : r.from + ' to ' + r.to}</p>
    <div class="cats">${chips}</div>
    ${DP === 'custom' ? `<div class="bar"><input class="in" type="date" id="dFrom" value="${r.from}" aria-label="From"><input class="in" type="date" id="dTo" value="${r.to}" aria-label="To"><button class="btn dark" id="dGo">Show</button></div>` : ''}
    <div id="dBody"><p class="muted">Loading…</p></div></div>`;
  let d;
  try { d = await api('dashboard', {from:r.from, to:r.to}); } catch(e){ $('#dBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (VIEW !== 'dash') return;
  const bars = (list, fmt = rs) => { const max = Math.max(1, ...list.map(x => x.value));
    return list.length ? list.map(x => `<div class="hb num"><span>${esc(x.name)}</span><div class="t"><i style="width:${x.value / max * 100}%"></i></div><span class="v">${fmt(x.value)}</span></div>`).join('') : '<div class="empty" style="padding:12px">No sales in this period.</div>'; };
  const hours = (d.byHour || []).map(h => ({name:h.name + ':00', value:h.value}));
  $('#dBody').innerHTML = `
    ${d.itemsWithoutCost && d.itemsWithoutCost.length ? `<div class="warn"><b>${d.itemsWithoutCost.length} item${d.itemsWithoutCost.length === 1 ? '' : 's'} have no cost price</b>, so profit may look higher than it is. Add it in Menu: ${esc(d.itemsWithoutCost.slice(0,4).join(', '))}${d.itemsWithoutCost.length > 4 ? '…' : ''}</div>` : ''}
    <div class="dk num">
      <div><small>Sales</small><b>${rs(d.sales)}</b></div>
      <div class="pf ${d.profit < 0 ? 'neg' : ''}"><small>Profit</small><b>${rs(d.profit)}</b></div>
      <div class="pf ${d.margin < 0 ? 'neg' : ''}"><small>Margin</small><b>${d.margin}%</b></div>
      <div><small>Bills</small><b>${d.bills}</b></div>
      <div><small>Average bill</small><b>${rs(d.averageBill)}</b></div>
      <div><small>Discounts given</small><b>${rs(d.discount)}</b></div>
    </div>
    <div class="pays num">${[['Cash','#2F7D4F'],['Card','#2E7FB8'],['Bank Transfer','#8A4FBF']].map(([k, c]) => { const v = (d.byPayment.find(x => x.name === k) || {value:0}).value;
      return `<div style="--c:${c}"><small>${k}</small><b>${rs(v)}</b><span>${d.sales ? Math.round(v / d.sales * 100) : 0}% of sales</span></div>`; }).join('')}</div>
    <div class="dcard"><h3>Top items</h3>${d.topItems.length ? `<table class="tbl num"><thead><tr><th>Item</th><th class="r">Sold</th><th class="r">Sales</th><th class="r">Profit</th></tr></thead><tbody>
      ${d.topItems.map(i => `<tr><td>${esc(i.name)}</td><td class="r">${i.qty}</td><td class="r">${rs(i.sales)}</td><td class="r" style="color:${i.profit < 0 ? 'var(--chili)' : 'var(--leaf)'}">${rs(i.profit)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty" style="padding:12px">No sales in this period.</div>'}</div>
    <div class="d2">
      <div class="dcard"><h3>By category</h3>${bars(d.byCategory)}</div>
      <div class="dcard"><h3>Dine-in vs Takeaway</h3>${bars(d.byOrderType)}</div>
      <div class="dcard"><h3>${d.from === d.to ? 'By hour' : 'By day'}</h3>${bars(d.from === d.to ? hours : d.byDay)}</div>
    </div>
    <div class="dcard"><h3>Low stock</h3>${d.lowStock.length ? d.lowStock.map(i => `<div class="hb num"><span>${esc(i.name)}</span><span></span><span class="v" style="color:var(--chili)">${i.stock} left</span></div>`).join('') : '<div class="empty" style="padding:12px">All tracked items have enough stock.</div>'}</div>
    <button class="btn ghost" style="width:100%" id="dRef">Refresh</button>`;
}
document.addEventListener('click', e => {
  if (VIEW !== 'dash') return;
  const c = e.target.closest('[data-dp]'); if (c){ DP = c.dataset.dp; renderDash(); return; }
  if (e.target.id === 'dGo'){ DR = {from:$('#dFrom').value, to:$('#dTo').value}; if (DR.to && DR.from > DR.to){ toast('The start date is after the end date.', {bad:true}); return; } renderDash(); }
  if (e.target.id === 'dRef') renderDash();
});

document.addEventListener('click', e => { if (VIEW === 'menu'){ const b = e.target.closest('[data-edit]'); if (b) editItem(b.dataset.edit); } });

boot();
</script>
